[package]
name = "awake"
version = "0.2.0"
edition = "2024"
description = "Keeps the Mac awake from the menu bar."
authors = ["vladkens"]
license = "MIT"
repository = "https://github.com/vladkens/awake"

[package.metadata.shipo]
id = "me.vladkens.awake"
name = "Awake"
icon = "assets/icon.png"
comment = "Keeps the Mac awake from the menu bar"

[package.metadata.shipo.macos]
accessory = true
plist.LSMinimumSystemVersion = "13.0"
# The languages of locales/: macOS lists the app under them in System Settings › General ›
# Language & Region › Applications, where a person picks its language.
plist.CFBundleLocalizations = ["en", "de", "es", "fr", "it", "ja", "ko", "pl", "pt-BR", "ru", "tr", "uk", "zh-Hans"]

[dependencies]
block2 = "0.6.2"
nimbo = { version = "0.0.1", git = "https://github.com/vladkens/nimbo", branch = "v1-prep", features = ["tray", "autostart", "png"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSImage", "NSBitmapImageRep", "NSImageRep", "NSGraphicsContext", "NSGraphics", "NSWorkspace"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFRunLoop", "CFString", "CFNotificationCenter"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSDictionary", "NSGeometry", "NSNotification", "NSObject", "NSOperation", "NSProcessInfo", "NSString", "NSUserDefaults", "NSValue", "NSDate"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "ps", "pwr_mgt"] }
shipo = { version = "0.2.1", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "env-filter"] }

[dev-dependencies]
nimbo = { version = "0.0.1", git = "https://github.com/vladkens/nimbo", branch = "v1-prep", features = ["harness"] }

[profile.release]
debug = 1

# The release files of `make dist` (CI): stripped, thin LTO.
[profile.dist]
inherits = "release"
debug = false
strip = true
lto = "thin"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
