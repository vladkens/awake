[package]
name = "awake"
version = "0.1.0"
edition = "2024"
description = "Keeps the Mac awake from the menu bar."
authors = ["vladkens"]
license = "MIT"
repository = "https://github.com/vladkens/awake"

[dependencies]
block2 = "0.6.2"
nimbo = { git = "https://github.com/vladkens/nimbo", rev = "e59fb2c", version = "0.0.1" }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage", "NSBitmapImageRep", "NSImageRep", "NSGraphicsContext", "NSGraphics", "NSMenu", "NSMenuItem", "NSWorkspace", "NSCell"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFRunLoop", "CFString"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSBundle", "NSData", "NSDictionary", "NSGeometry", "NSNotification", "NSObject", "NSOperation", "NSProcessInfo", "NSString", "NSUserDefaults", "NSValue"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "ps", "pwr_mgt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "env-filter"] }

[profile.release]
debug = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
