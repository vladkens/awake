name: main

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event.head_commit.message, 'release:') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: astral-sh/setup-uv@v7
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: make check
      - run: make test

  # A job per Mac: the Intel build is cross-compiled on Apple silicon. Also on release PRs, which
  # rust-build checks.
  build:
    name: build ${{ matrix.target }}
    if: "github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.title, 'release: v')"
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add ${{ matrix.target }}
      - uses: vladkens/actions/rust-build@v1
        with:
          name: Awake
          dist: make dist T=${{ matrix.target }}
          dev: true
          crates: false
          artifact: release-${{ matrix.target }}

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # One artifact for rust-publish, from the build jobs' own.
      - uses: actions/upload-artifact/merge@v7
        with:
          name: release
          pattern: release-*
      # shipo, the packer: its latest release's prebuilt binary.
      - run: |
          mkdir -p "$RUNNER_TEMP/shipo"
          gh release download -R vladkens/shipo --pattern '*x86_64-unknown-linux-musl.tar.gz' -O - | tar -xz -C "$RUNNER_TEMP/shipo" shipo
          echo "$RUNNER_TEMP/shipo" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
      - id: release
        uses: vladkens/actions/rust-publish@v1
        with:
          name: Awake
          crates: false
          pack: make pack
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SHIPO_UPDATE_KEY: ${{ secrets.SHIPO_UPDATE_KEY }}
      # The cask's DMGs, on a release only.
      - uses: vladkens/actions/homebrew-bump@v1
        with:
          tag: ${{ steps.release.outputs.tag }}
          file: ${{ steps.release.outputs.files }}
          tap: vladkens/homebrew-tap
          formula: Casks/awake.rb
          token: ${{ secrets.HOMEBREW_REPO_TOKEN }}
